<text x="28" y="44" font-size="20" font-weight="700" fill="#1e293b" text-anchor="start">My Markdown Files post: raw and rendered</text><text x="28" y="68" font-size="13.5" font-weight="400" fill="#5b6779" text-anchor="start">The same file, read as plain text and read through a Markdown app.</text><rect x="28" y="92" width="392" height="470" rx="8" fill="#ffffff" stroke="#c9d2dc"/><path d="M28,100 a8,8 0 0 1 8,-8 h376 a8,8 0 0 1 8,8 v24 h-392 z" fill="#eef1f5"/><line x1="28" y1="124" x2="420" y2="124" stroke="#c9d2dc"/><text x="42" y="113" font-size="12" font-weight="600" fill="#5b6779" text-anchor="start">markdown-files.md  ·  raw text</text><text x="42" y="144" font-size="11.8" font-weight="400" fill="#5b6779" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">---</text><text x="42" y="162" font-size="11.8" font-weight="400" fill="#1e293b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">title: Markdown Files</text><text x="42" y="180" font-size="11.8" font-weight="400" fill="#1e293b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">description: Markdown has become</text><text x="42" y="198" font-size="11.8" font-weight="400" fill="#1e293b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">  the default format of text</text><text x="42" y="216" font-size="11.8" font-weight="400" fill="#1e293b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">  from AI models.</text><text x="42" y="234" font-size="11.8" font-weight="400" fill="#1e293b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">pubDatetime: 2026-10-07T13:42:00Z</text><text x="42" y="252" font-size="11.8" font-weight="400" fill="#1e293b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">draft: false</text><text x="42" y="270" font-size="11.8" font-weight="400" fill="#5b6779" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">---</text><text x="42" y="288" font-size="11.8" font-weight="400" fill="#1e293b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">As a Knowledge Worker, I am</text><text x="42" y="306" font-size="11.8" font-weight="400" fill="#1e293b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">experimenting with better ways to:</text><text x="42" y="324" font-size="11.8" font-weight="400" fill="#1e293b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace"></text><text x="42" y="342" font-size="11.8" font-weight="400" fill="#1e293b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">a) View, manage and edit Markdown</text><text x="42" y="360" font-size="11.8" font-weight="400" fill="#1e293b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">files, and</text><text x="42" y="378" font-size="11.8" font-weight="400" fill="#1e293b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace"></text><text x="42" y="396" font-size="11.8" font-weight="400" fill="#1e293b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">b) Share Markdown files with</text><text x="42" y="414" font-size="11.8" font-weight="400" fill="#1e293b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">external parties, and</text><text x="42" y="432" font-size="11.8" font-weight="400" fill="#1e293b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace"></text><text x="42" y="450" font-size="11.8" font-weight="400" fill="#1e293b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">c) Present Markdown files in a</text><text x="42" y="468" font-size="11.8" font-weight="400" fill="#1e293b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">professional manner.</text><text x="42" y="486" font-size="11.8" font-weight="400" fill="#1e293b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace"></text><text x="42" y="504" font-size="11.8" font-weight="400" fill="#1e293b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">At the moment, I still think using</text><text x="42" y="522" font-size="11.8" font-weight="400" fill="#1e293b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">SharePoint is easiest for dealing</text><text x="42" y="540" font-size="11.8" font-weight="400" fill="#1e293b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">with Markdown files.</text><rect x="440" y="92" width="392" height="470" rx="8" fill="#ffffff" stroke="#c9d2dc"/><path d="M440,100 a8,8 0 0 1 8,-8 h376 a8,8 0 0 1 8,8 v24 h-392 z" fill="#eef1f5"/><line x1="440" y1="124" x2="832" y2="124" stroke="#c9d2dc"/><text x="454" y="113" font-size="12" font-weight="600" fill="#5b6779" text-anchor="start">Rendered view</text><text x="464" y="164" font-size="24" font-weight="700" fill="#1e293b" text-anchor="start">Markdown Files</text><text x="464" y="190" font-size="13" font-weight="400" fill="#5b6779" text-anchor="start">Markdown has become the default format</text><text x="464" y="208" font-size="13" font-weight="400" fill="#5b6779" text-anchor="start">of text from AI models.</text><line x1="464" y1="224" x2="808" y2="224" stroke="#e2e8f0"/><text x="464" y="252" font-size="13.5" font-weight="400" fill="#1e293b" text-anchor="start">As a Knowledge Worker, I am experimenting</text><text x="464" y="272" font-size="13.5" font-weight="400" fill="#1e293b" text-anchor="start">with better ways to:</text><text x="464" y="304" font-size="13.5" font-weight="400" fill="#1e293b" text-anchor="start">a) View, manage and edit Markdown files, and</text><text x="464" y="336" font-size="13.5" font-weight="400" fill="#1e293b" text-anchor="start">b) Share Markdown files with external</text><text x="464" y="356" font-size="13.5" font-weight="400" fill="#1e293b" text-anchor="start">parties, and</text><text x="464" y="388" font-size="13.5" font-weight="400" fill="#1e293b" text-anchor="start">c) Present Markdown files in a</text><text x="464" y="408" font-size="13.5" font-weight="400" fill="#1e293b" text-anchor="start">professional manner.</text><text x="464" y="440" font-size="13.5" font-weight="400" fill="#1e293b" text-anchor="start">At the moment, I still think using SharePoint</text><text x="464" y="460" font-size="13.5" font-weight="400" fill="#1e293b" text-anchor="start">is easiest for dealing with Markdown files.</text><text x="28" y="584" font-size="12" font-weight="500" fill="#1f63a6" text-anchor="start">The metadata between the --- lines is hidden or shown as a title, depending on the app.</text></svg>