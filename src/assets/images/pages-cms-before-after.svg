<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 384" width="820" height="384" role="img" aria-label="Diagram: before, pasting code into GitHub led to build errors; after, a Pages CMS form saves valid files" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6779"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker></defs>
<rect x="1" y="1" width="818" height="382" rx="12" fill="#ffffff" stroke="#d6dde5"/>
<text x="28" y="44" font-size="20" font-weight="700" fill="#1e293b" text-anchor="start">Editing a post: before and after Pages CMS</text><text x="28" y="68" font-size="13.5" font-weight="400" fill="#5b6779" text-anchor="start">The CMS removes the step where most of my errors came from.</text><rect x="20" y="92" width="780" height="118" rx="10" fill="#fdecea" opacity="0.55"/><text x="36" y="116" font-size="13" font-weight="700" fill="#b42318" text-anchor="start">Before</text><rect x="20" y="226" width="780" height="136" rx="10" fill="#e6f4f2" opacity="0.55"/><text x="36" y="250" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start">After</text><rect x="36" y="132" width="128" height="58" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="100.0" y="158" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle">Ask Claude</text><text x="100.0" y="174" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle">for the change</text><line x1="166" y1="161" x2="193" y2="161" stroke="#5b6779" stroke-width="1.6" marker-end="url(#a)"/><rect x="196" y="132" width="128" height="58" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="260.0" y="158" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle">Paste into the</text><text x="260.0" y="174" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle">GitHub editor</text><line x1="326" y1="161" x2="353" y2="161" stroke="#5b6779" stroke-width="1.6" marker-end="url(#a)"/><rect x="356" y="132" width="128" height="58" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="420.0" y="166" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle">Commit</text><line x1="486" y1="161" x2="513" y2="161" stroke="#5b6779" stroke-width="1.6" marker-end="url(#a)"/><rect x="516" y="132" width="128" height="58" rx="8" fill="#ffffff" stroke="#b42318" stroke-width="1.5"/><text x="580.0" y="166" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle">Astro build</text><line x1="646" y1="161" x2="673" y2="161" stroke="#5b6779" stroke-width="1.6" marker-end="url(#a)"/><rect x="676" y="132" width="108" height="58" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="730.0" y="166" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle">Live site</text><path d="M580.0,132 C580.0,106 260.0,106 260.0,129" fill="none" stroke="#b42318" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#r)"/><text x="420.0" y="108" font-size="12" font-weight="500" fill="#b42318" text-anchor="middle">one typo in a date or tag breaks the build</text><rect x="36" y="262" width="160" height="58" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="116.0" y="288" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle">Fill in a form</text><text x="116.0" y="304" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle">in Pages CMS</text><line x1="198" y1="291" x2="233" y2="291" stroke="#5b6779" stroke-width="1.6" marker-end="url(#a)"/><rect x="236" y="262" width="160" height="58" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="316.0" y="288" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle">Save</text><text x="316.0" y="304" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle">(commits for me)</text><line x1="398" y1="291" x2="433" y2="291" stroke="#5b6779" stroke-width="1.6" marker-end="url(#a)"/><rect x="436" y="262" width="160" height="58" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="516.0" y="296" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle">Astro build</text><line x1="598" y1="291" x2="673" y2="291" stroke="#5b6779" stroke-width="1.6" marker-end="url(#a)"/><rect x="676" y="262" width="108" height="58" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="730.0" y="296" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle">Live site</text><text x="36" y="348" font-size="12" font-weight="500" fill="#0f766e" text-anchor="start">Date picker and one-box-per-tag keep the format valid</text></svg>