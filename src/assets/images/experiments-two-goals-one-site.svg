<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" role="img" aria-label="Diagram: two goals, showing up in AI answers and managing Markdown, both running through one GitHub site" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6779"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker></defs>
<rect x="1" y="1" width="838" height="468" rx="12" fill="#ffffff" stroke="#d6dde5"/>
<text x="28" y="44" font-size="20" font-weight="700" fill="#1e293b" text-anchor="start">Two experiments, one site</text><text x="28" y="68" font-size="13.5" font-weight="400" fill="#5b6779" text-anchor="start">Both goals run through the same GitHub repo, which is why they got tangled.</text><rect x="28" y="92" width="376" height="262" rx="10" fill="#eaf2fb" opacity="0.7"/><rect x="436" y="92" width="376" height="262" rx="10" fill="#e6f4f2" opacity="0.7"/><text x="44" y="118" font-size="14" font-weight="700" fill="#1f63a6" text-anchor="start">Goal 1: Show up in AI answers (GEO)</text><text x="452" y="118" font-size="14" font-weight="700" fill="#0f766e" text-anchor="start">Goal 2: A better way to manage Markdown</text><rect x="44" y="132" width="344" height="49" rx="8" fill="#ffffff" stroke="#1f63a6" stroke-width="1.4"/><text x="58" y="152" font-size="13" font-weight="600" fill="#1e293b" text-anchor="start">Structured data</text><text x="58" y="170" font-size="12" font-weight="400" fill="#5b6779" text-anchor="start">so AI can read who I am</text><rect x="44" y="187" width="344" height="49" rx="8" fill="#ffffff" stroke="#1f63a6" stroke-width="1.4"/><text x="58" y="207" font-size="13" font-weight="600" fill="#1e293b" text-anchor="start">Google and Bing</text><text x="58" y="225" font-size="12" font-weight="400" fill="#5b6779" text-anchor="start">can see and index it</text><rect x="44" y="242" width="344" height="49" rx="8" fill="#ffffff" stroke="#1f63a6" stroke-width="1.4"/><text x="58" y="262" font-size="13" font-weight="600" fill="#1e293b" text-anchor="start">Content</text><text x="58" y="280" font-size="12" font-weight="400" fill="#5b6779" text-anchor="start">that answers the questions I want</text><rect x="44" y="297" width="344" height="49" rx="8" fill="#ffffff" stroke="#1f63a6" stroke-width="1.4"/><text x="58" y="317" font-size="13" font-weight="600" fill="#1e293b" text-anchor="start">Links to my site</text><text x="58" y="335" font-size="12" font-weight="400" fill="#5b6779" text-anchor="start">third-party citations</text><rect x="452" y="132" width="344" height="49" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="466" y="152" font-size="13" font-weight="600" fill="#1e293b" text-anchor="start">Pages CMS</text><text x="466" y="170" font-size="12" font-weight="400" fill="#5b6779" text-anchor="start">create and edit files without code</text><rect x="452" y="187" width="344" height="49" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="466" y="207" font-size="13" font-weight="600" fill="#1e293b" text-anchor="start">Look and feel</text><text x="466" y="225" font-size="12" font-weight="400" fill="#5b6779" text-anchor="start">so the site beats a SharePoint view</text><rect x="452" y="242" width="344" height="104" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="5 4"/><text x="624.0" y="292" font-size="12.5" font-weight="600" fill="#5b6779" text-anchor="middle">Still to compare:</text><text x="624.0" y="312" font-size="12.5" font-weight="400" fill="#5b6779" text-anchor="middle">GitHub vs SharePoint for Markdown</text><path d="M216.0,354 C216.0,380 330,372 330,393" fill="none" stroke="#1f63a6" stroke-width="1.6" marker-end="url(#a)"/><path d="M624.0,354 C624.0,380 510,372 510,393" fill="none" stroke="#0f766e" stroke-width="1.6" marker-end="url(#a)"/><rect x="270" y="396" width="300" height="50" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.6"/><text x="420.0" y="418" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">One GitHub repo and site</text><text x="420.0" y="436" font-size="12" font-weight="400" fill="#5b6779" text-anchor="middle">lisasimons.github.io</text></svg>