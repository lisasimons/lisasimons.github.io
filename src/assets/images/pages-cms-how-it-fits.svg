<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 876 360" width="876" height="360" role="img" aria-label="Diagram: Me, Pages CMS, GitHub repo, GitHub Actions and GitHub Pages, with .pages.yml configuring the CMS" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6779"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker></defs>
<rect x="1" y="1" width="874" height="358" rx="12" fill="#ffffff" stroke="#d6dde5"/>
<text x="28" y="44" font-size="20" font-weight="700" fill="#1e293b" text-anchor="start">How Pages CMS fits into my site</text><text x="28" y="68" font-size="13.5" font-weight="400" fill="#5b6779" text-anchor="start">Pages CMS is a friendlier front door. The files still live in GitHub.</text><rect x="28" y="104" width="148" height="100" rx="8" fill="#eaf2fb" stroke="#1f63a6" stroke-width="1.5"/><text x="102.0" y="132" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">Me</text><text x="102.0" y="154" font-size="12.5" font-weight="400" fill="#5b6779" text-anchor="middle">write and edit</text><text x="102.0" y="171" font-size="12.5" font-weight="400" fill="#5b6779" text-anchor="middle">posts</text><line x1="178" y1="154.0" x2="193" y2="154.0" stroke="#5b6779" stroke-width="1.6" marker-end="url(#a)"/><rect x="196" y="104" width="148" height="100" rx="8" fill="#eaf2fb" stroke="#1f63a6" stroke-width="1.5"/><text x="270.0" y="132" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">Pages CMS</text><text x="270.0" y="154" font-size="12.5" font-weight="400" fill="#5b6779" text-anchor="middle">form editor;</text><text x="270.0" y="171" font-size="12.5" font-weight="400" fill="#5b6779" text-anchor="middle">Save = a commit</text><line x1="346" y1="154.0" x2="361" y2="154.0" stroke="#5b6779" stroke-width="1.6" marker-end="url(#a)"/><rect x="364" y="104" width="148" height="100" rx="8" fill="#eaf2fb" stroke="#1f63a6" stroke-width="1.5"/><text x="438.0" y="132" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">GitHub repo</text><text x="438.0" y="154" font-size="12.5" font-weight="400" fill="#5b6779" text-anchor="middle">Markdown files</text><text x="438.0" y="171" font-size="12.5" font-weight="400" fill="#5b6779" text-anchor="middle">and images</text><line x1="514" y1="154.0" x2="529" y2="154.0" stroke="#5b6779" stroke-width="1.6" marker-end="url(#a)"/><rect x="532" y="104" width="148" height="100" rx="8" fill="#eaf2fb" stroke="#1f63a6" stroke-width="1.5"/><text x="606.0" y="132" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">GitHub Actions</text><text x="606.0" y="154" font-size="12.5" font-weight="400" fill="#5b6779" text-anchor="middle">builds with Astro</text><text x="606.0" y="171" font-size="12.5" font-weight="400" fill="#5b6779" text-anchor="middle">in about 1–2 min</text><line x1="682" y1="154.0" x2="697" y2="154.0" stroke="#5b6779" stroke-width="1.6" marker-end="url(#a)"/><rect x="700" y="104" width="148" height="100" rx="8" fill="#eaf2fb" stroke="#1f63a6" stroke-width="1.5"/><text x="774.0" y="132" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">GitHub Pages</text><text x="774.0" y="154" font-size="12.5" font-weight="400" fill="#5b6779" text-anchor="middle">publishes</text><text x="774.0" y="171" font-size="12.5" font-weight="400" fill="#5b6779" text-anchor="middle">lisasimons.github.io</text><rect x="196" y="262" width="316" height="66" rx="8" fill="#f3f5f8" stroke="#94a3b8" stroke-dasharray="5 4"/><text x="212" y="289" font-size="14" font-weight="600" fill="#1e293b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">.pages.yml</text><text x="212" y="311" font-size="12.5" font-weight="400" fill="#5b6779" text-anchor="start">tells the CMS which folders and fields to show</text><line x1="270.0" y1="261" x2="270.0" y2="208" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="278.0" y="244" font-size="12" font-weight="400" fill="#5b6779" text-anchor="start">configures</text><line x1="438.0" y1="204" x2="438.0" y2="262" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 3"/><text x="446.0" y="244" font-size="12" font-weight="400" fill="#5b6779" text-anchor="start">lives in</text></svg>